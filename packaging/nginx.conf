# The page-only image's nginx. It replaces the base image's `/etc/nginx/nginx.conf`
# wholesale, because what this image decides is http-level: the media-type table, the
# cache policy a name carries, and the log, which must not carry a request URL.
#
# Both the table and the policy mirror `content_type`, `cache_control`, `CSP` and
# `headers` in the reference server's `crates/selvaged/src/page.rs`, the handler the
# one-origin deployment serves this same `dist/` through. The second origin has to
# answer the same types, the same cache policy and the same hardening, or the two
# deployments of one bundle would differ in ways nothing notices until a browser
# refuses a chunk. The table here is checked from outside: `scripts/check-page.sh`
# runs the page's own `scripts/check-content-types.mjs` (whose `EXPECTED_TYPES` names
# every extension the bundle emits) against a running container, so an extension the
# build starts emitting and this file has not learned fails the pull request rather
# than the deployment.
#
# Nothing here writes to the root filesystem: the pid file and the five temp paths
# under `/dev/shm` are the only writes, and `/dev/shm` is a tmpfs the container
# runtime mounts itself. That is what lets the image run under `--read-only` with no
# writable mount and every capability dropped, which `scripts/container-smoke.sh`
# asserts.

worker_processes auto;
pid /dev/shm/nginx.pid;

# No request URL reaches either log. An invite is a page link — `/?room=…&token=…` —
# so the request line carries the room token, which `PROTOCOL.md` §12 makes a MUST
# not to log. `access_log` is off below; this one is at `crit`, above the `error`
# level at which nginx appends the request line to a request-scoped fault, which the
# relay's upstream can produce. What is kept is every process-level fault, and those
# carry no request.
error_log /dev/stderr crit;

events {
    worker_connections 1024;
}

http {
    # Every URL here may carry the room token, so there is nothing in a request line
    # this deployment is allowed to keep: off, not filtered.
    access_log off;

    # nginx creates each of its five temp directories at startup and treats a failure
    # as fatal, so none of them is left to the base image's compiled default: every one
    # is declared here onto the runtime's own tmpfs, which is the only writable path
    # this container has.
    client_body_temp_path /dev/shm/client_temp;
    proxy_temp_path       /dev/shm/proxy_temp;
    fastcgi_temp_path     /dev/shm/fastcgi_temp;
    uwsgi_temp_path       /dev/shm/uwsgi_temp;
    scgi_temp_path        /dev/shm/scgi_temp;

    # `include mime.types` is deliberately absent: the host's mime database is not the
    # policy. Each value is the whole header value, charset included, exactly as the
    # handler's `content_type` returns it; the `charset` directive is not used, because
    # its list of types is a second table to keep in step with this one. An unknown
    # extension is opaque bytes, never HTML.
    types {
        "text/html; charset=utf-8"                  html;
        "text/javascript; charset=utf-8"            js mjs;
        "text/css; charset=utf-8"                   css;
        "application/json; charset=utf-8"           json map;
        "application/manifest+json; charset=utf-8"  webmanifest;
        application/wasm                            wasm;
        image/svg+xml                               svg;
        image/png                                   png;
        image/x-icon                                ico;
        font/ttf                                    ttf;
        font/woff                                   woff;
        font/woff2                                  woff2;
        "text/plain; charset=utf-8"                 txt;
    }
    default_type application/octet-stream;

    # The name is the cache policy, decided exactly as `is_content_hashed` decides it:
    # a name carrying a content hash is pinned for a year, every other name is
    # revalidated. The hash is the run after the last `-` before the extension, eight
    # or more characters of the alphabet a hash is written in, and the extensions are
    # the ones the bundler hashes — so `lang-255Y2KCL.js` is pinned and
    # `lang-255Y2KCL.js.map` is not, its extension being `map` with the hash's dot in
    # the way, which is what the same rule says about the same name.
    # The key is quoted whole, `~` included, because a regex containing `{` is a token
    # nginx's config lexer would otherwise cut at the brace; the quotes come off before
    # the `~` is read, and the pattern reaches the regex engine as written.
    map $uri $cache_control {
        default "no-cache";
        "~^/[^/]+-[A-Za-z0-9_-]{8,}\.(js|css|map|ttf|woff|woff2|png|svg)$" "public, max-age=31536000, immutable";
    }

    # `$http_upgrade` is `upgrade` on a WebSocket dial and absent on an ordinary
    # request; a `Connection: upgrade` on an ordinary request would be a lie to the
    # upstream. The relay's `/session` location uses the derived value; nothing else
    # reads it while no server is configured.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
