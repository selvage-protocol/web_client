# The page-only image's one server block. This file is included from the `http` block
# of `packaging/nginx.conf`, which is where the media-type table and the cache policy
# live; here is the page, its headers, and the origin relay when one is configured.
#
# This image serves the browser client. On its own it serves no endpoint: `/meta` and
# `/session` answer 404 (with the page's own `404.html`, like any path it does not
# have) because they do not exist here. With `SELVAGE_SERVER` set it is the single
# origin of a room instead, relaying the two endpoints to that server so a guest's
# browser reads the room's server at the page's own origin; with no server configured
# the relay is absent and the two paths answer 404 as they did before.

server {
    listen 8080;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;

    # The origin relay's two locations, written under `/dev/shm` by the entrypoint
    # from `SELVAGE_SERVER` (see `packaging/relay.conf.template`). The file is empty
    # when no server is configured, so the include adds nothing and `/session` and
    # `/meta` fall through to `location /` and its 404.
    include /dev/shm/selvage-relay.conf;

    # `page.rs`'s own four headers beside the media type. The cache policy is the
    # name's (see the map in `nginx.conf`); the last three are the hardening a static
    # handler forgets — an invite URL carries the room token, so its referrer is
    # withheld from every origin the page visits, `nosniff` holds a response to the
    # media type that table gave it, and the policy is the page's own.
    add_header Cache-Control $cache_control always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; worker-src 'self' blob:; connect-src 'self' ws: wss: http: https:; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location / {
        # A static page is read and never written. `deny` answers anything that is not
        # a read with 403, so the image carries no write path at all.
        limit_except GET HEAD {
            deny all;
        }
    }
}
