# One-command self-host for the browser client's page on an origin of its own.
#
# This is the page-only shape by default: the bundle this image carries dials the
# `selvaged` named in the share link (or built into the page), and this service
# answers the page and nothing else. Set `SELVAGE_SERVER` and it is the single
# origin of a room instead: the image relays `/session` and `/meta` to that server,
# so a guest's browser reads the room's server at the page's own origin. One origin
# is still the default shape of a deployment — a `selvaged --serve-page` listener
# with a page mounted under it — and this file is the page half of the other one;
# `docs/serving-the-page.md` owns the choice, what each shape costs, and what the
# relay does not do that `PROTOCOL.md` §12 asks of a public front.
#
# The page is published as `ghcr.io/selvage-protocol/selvage-web`, so it can be
# pulled from the registry; `build: .` still builds it from this checkout and
# names it locally, and the `image:` line below can name a registry tag instead
# (compose still builds from the checkout when it is absent).
#
# No volumes: the image carries the page it serves and nginx's only writable paths
# — the pid file and its five temp directories — are already moved onto
# `/dev/shm`, the tmpfs the container runtime mounts itself, by
# `packaging/nginx.conf`. That is what lets the run below be read-only with no
# writable mount at all, so it needs no `tmpfs:` entry of its own; the same flags
# run unmounted in `scripts/container-smoke.sh`, which reads them back off the
# daemon's record of the container and asserts this file too.
services:
  selvage-web:
    build: .
    image: selvage-web:latest
    environment:
      # Empty by default: no upstream, no relay, the page on its own. Set it to an
      # `http://`, `https://` or bare `host:port` base to make this origin the
      # room's server. With the two-container example below it is
      # `http://selvaged:8080`, the server's service name and port.
      SELVAGE_SERVER: ${SELVAGE_SERVER:-}
    ports:
      # The container listens on 8080 and must: it runs as uid 101
      # (nginx-unprivileged) with every capability dropped, and a non-root
      # process cannot bind below 1024. The host side is free to be the standard
      # web port — the daemon's own proxy binds 80 — so the default deployment
      # simply answers on it. Rebind to `127.0.0.1:8080:8080` for a local
      # evaluation that must not be reachable beyond this machine.
      - "80:8080"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

# Two containers, one origin. The page relays to the server: it publishes on loopback
# 8080, the server publishes nothing and is reachable only from the page, and
# `SELVAGE_SERVER` points the relay at the server's service name. A guest's invite link
# is then the page's own address — `http://127.0.0.1:8080/?room=…` — and `/meta` and
# `/session` answer from that same origin. Here the page is a route to the server, not
# the front `PROTOCOL.md` §12 asks a public deployment for: a terminator or a proxy in
# front is what supplies the connection cap, the idle deadline and the rate limit, the
# way `reference_server/deploy/proxy/` does.
#
# `depends_on` below is not decoration. nginx resolves the upstream's name once, when it
# loads its configuration at startup, and holds that address for the life of the process:
# a page started before the server exists exits with `host not found in upstream`, which is
# why it starts after, and a recreated server can come back at a different address that the
# page goes on dialling until it restarts — hence `restart: true`.
#
# Uncomment both services and drop the `selvage-web` service above, or run them as a
# second compose file.
#
#   docker compose up --detach   # http://127.0.0.1:8080/
#
# services:
#   selvage-web:
#     build: .
#     image: selvage-web:latest
#     environment:
#       SELVAGE_SERVER: http://selvaged:8080
#     depends_on:
#       selvaged:
#         condition: service_started
#         restart: true
#     ports:
#       - "127.0.0.1:8080:8080"
#     read_only: true
#     cap_drop:
#       - ALL
#     security_opt:
#       - no-new-privileges:true
#     restart: unless-stopped
#   selvaged:
#     image: ghcr.io/selvage-protocol/selvaged:latest
#     # The server half of the split: the page is served above, so this one only
#     # listens and answers `/session` and `/meta`.
#     command: ["--listen", "0.0.0.0:8080"]
#     read_only: true
#     cap_drop:
#       - ALL
#     security_opt:
#       - no-new-privileges:true
#     restart: unless-stopped
