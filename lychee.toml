# What the link check does not check, and why.
#
# The scope is this repository's reader-facing front matter: `README.md` and every
# file under `docs/`, which `scripts/ci-local.sh links` names rather than globbing,
# so a file nobody links to is still read. Nothing else in the tree is prose.
#
# `^mailto:` is an address a person can write to and not one anything can fetch.
# The check runs lychee without `--include-mail`, so a `mailto:` is excluded whether
# or not it is named here; naming it says that on purpose rather than by default.
#
# The two loopback addresses are the ones this repository's prose prints: the dev
# server `http://localhost:8081/` the README tells a reader to open, the page
# container `http://localhost/` in `docs/serving-the-page.md`, and
# `http://127.0.0.1:8081`, the address a page check is pointed at. Each answers on the reader's own
# machine while that reader is running something there and nowhere else, so a check
# that could only pass with those servers up would fail every time. lychee reads no
# URL out of an inline code span or a fenced block, which is where every one of them
# stands today, so these are the addresses a later edit could turn into links rather
# than ones a run failed on.
#
# Every other link is expected to resolve and is checked. If a URL ever needs another
# exclusion, add it here with its reason beside it.
exclude = ["^mailto:", "^https?://localhost[:/]", "^https?://127\\.0\\.0\\.1[:/]"]
