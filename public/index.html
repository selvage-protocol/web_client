<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Selvage — shared editing in the browser</title>
    <meta name="description" content="This page joins a live editing session as a guest. The host's working copy stays the source of truth; what you type here goes to the room." />
    <meta name="theme-color" content="#1e1e2e" />
    <meta property="og:title" content="Selvage — shared editing in the browser" />
    <meta property="og:description" content="This page joins a live editing session as a guest. The host's working copy stays the source of truth; what you type here goes to the room." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="mark-opaque.png" />
    <!-- app.css is the Monaco editor stylesheet only: the pre-join card is fully
         styled by the inline block below, so this loads without blocking first paint. -->
    <link rel="preload" href="app.css" as="style" />
    <link rel="stylesheet" href="app.css" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="app.css" /></noscript>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <style>
      /* One language with the landing page: Catppuccin Mocha, dark only, the
         same markup — base, mantle, subtext, mauve — and the svp mark. No
         gradient wash, no fetched font. */
      :root {
        color-scheme: dark;
        --background: #1e1e2e;
        --foreground: #cdd6f4;
        --card: #181825;
        --muted: #313244;
        --muted-hover: #45475a;
        --muted-foreground: #a6adc8;
        --border: #313244;
        --border-strong: #45475a;
        --input: #11111b;
        --placeholder: #7f849c;
        --danger: #f38ba8;
        --warning: #f9e2af;
        --primary: #cba6f7;
        --primary-hover: #d5b4fa;
        --primary-foreground: #1e1e2e;
        --ring: #cba6f7;
        --radius: 0.5rem;
        --shadow: 0 18px 44px -20px rgba(0, 0, 0, 0.8);
      }
      [hidden] { display: none !important; }
      html, body { height: 100%; margin: 0; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--background); color: var(--foreground); }
      #app { display: flex; flex-direction: column; height: 100%; }
      .icon { display: inline-flex; flex: none; }
      .icon svg { width: 1em; height: 1em; }
      button { font: inherit; color: var(--foreground); background: var(--muted);
        border: 1px solid var(--border); border-radius: var(--radius); padding: 0.35em 0.7em;
        cursor: pointer; display: inline-flex; align-items: center; gap: 0.45em; }
      button:hover:not(:disabled) { border-color: var(--primary); background: var(--muted-hover); }
      button:disabled { opacity: 0.45; cursor: default; }
      button.primary { background: var(--primary); border-color: var(--primary);
        color: var(--primary-foreground); font-weight: 600; }
      button.primary:hover:not(:disabled) { background: var(--primary-hover); border-color: var(--primary-hover); }
      button:focus-visible, input:focus-visible, summary:focus-visible, #share-group:focus-visible {
        outline: 2px solid var(--ring); outline-offset: 2px; }
      input { font: inherit; color: var(--foreground); background: var(--input);
        border: 1px solid var(--border); border-radius: var(--radius); padding: 0.45em 0.6em; }
      input::placeholder { color: var(--placeholder); }
      #session { display: flex; gap: 0.9em; align-items: center; padding: 0.6em 1.1em;
        background: var(--card); border-bottom: 1px solid var(--border); }
      #brand { display: inline-flex; align-items: center; gap: 0.5em; flex: none;
        font-weight: 650; letter-spacing: -0.01em; white-space: nowrap; }
      #brand .mark { width: 1.6em; height: 1.6em; flex: none; }
      /* The mark is inside the document, carried once as a symbol and used by
         the card and the brand: no request stands between the shell and the
         mark, so no frame can paint it as an empty box or as alt text. */
      .mark-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
      #session-note { display: flex; align-items: center; gap: 0.6em; padding: 0.7em 1.1em;
        background: var(--card); border-bottom: 1px solid var(--border);
        font-weight: 600; color: var(--warning); }
      #session-note::before { content: ''; flex: none; width: 0.5em; height: 0.5em;
        border-radius: 50%; background: currentColor; }
      #session-note:empty { display: none; }
      #share-group { display: flex; align-items: center; gap: 0.4em; flex: 0 1 auto;
        min-width: 0; max-width: 100%; padding: 0.3em 0.45em 0.3em 0.7em;
        background: var(--input); border: 1px solid var(--border); border-radius: var(--radius);
        color: var(--muted-foreground); position: relative;
        transition: border-color 0.15s ease; }
      /* Sized to its value by `fitReadout` (and to nothing when there is none,
         where the readonly text is empty), so the bar shows the whole link.
         `field-sizing` fits it exactly where the engine supports it; the
         `size` attribute is the fallback. */
      #share { flex: 0 0 auto; width: auto; max-width: 100%; font-size: 0.85em; padding: 0;
        background: none; border: none; color: transparent;
        field-sizing: content;
        text-shadow: 0 0 5px var(--muted-foreground);
        transition: color 180ms ease, text-shadow 180ms ease; }
      #share:focus { border: none; outline: none; }
      #share-group:focus-within { border-color: var(--primary); }
      #share-group:hover #share, #share-group:focus-within #share {
        color: var(--muted-foreground); text-shadow: none; }
      #share-group, #share-group *, #share-group.copied, #share-group.copied * {
        cursor: pointer; }
      #share-group .icon { display: inline-flex; flex: none; }
      #share-group:hover { border-color: var(--primary); }
      #share-group.copied { border-color: var(--primary); }
      #share-group .confirm { position: absolute; inset: 0; display: inline-flex;
        align-items: center; justify-content: center; gap: 0.45em;
        background: var(--input); border-radius: var(--radius);
        color: var(--primary); font-size: 0.9em; font-weight: 600; white-space: nowrap; }
      #alert { position: fixed; left: 50%; bottom: 1.25rem; transform: translateX(-50%);
        z-index: 4; box-sizing: border-box; max-width: min(34rem, calc(100vw - 2rem));
        padding: 0.7em 1em; background: var(--card); border: 1px solid var(--border-strong);
        border-left: 3px solid var(--danger); border-radius: var(--radius);
        box-shadow: var(--shadow); color: var(--foreground); }
      #alert:empty { display: none; }
      #follow-banner { display: flex; gap: 0.8em; align-items: center;
        padding: 0.5em 1.1em; font-weight: 600; border-bottom: 3px solid;
        color: var(--foreground); }
      #follow-banner button { font-weight: normal; font-size: 0.9em; }
      #workspace { display: flex; flex: 1; min-height: 0; }
      #side { width: 19rem; flex: none; overflow-y: auto; border-right: 1px solid var(--border);
        background: var(--card); padding: 0.9em 0.7em 1.2em; }
      #side h2 { font-size: 0.79em; text-transform: uppercase; letter-spacing: 0.08em;
        color: var(--muted-foreground); margin: 1.5em 0 0.5em; padding: 0 0.55em; }
      #side h2:first-child { margin-top: 0; }
      #roster { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.2em; }
      #roster li { display: flex; gap: 0.5em; align-items: center; padding: 0.45em 0.55em;
        border-radius: var(--radius); }
      #roster li:hover { background: var(--muted); }
      #roster li.following { background: var(--muted); outline: 1px solid var(--border-strong); }
      #roster .swatch { flex: none; width: 0.75em; height: 0.75em; border-radius: 50%; align-self: center; }
      #roster .who { flex: 1 1 auto; min-width: 0; display: flex; align-items: baseline; gap: 0.4em; line-height: 1.3; }
      #roster .name { font-weight: 700; color: var(--foreground); white-space: nowrap;
        overflow: hidden; text-overflow: ellipsis; }
      #roster .you { color: var(--muted-foreground); font-size: 0.75em; font-weight: 500; flex: none; }
      #roster li.self .swatch { background: var(--primary); }
      #roster .actions { display: flex; gap: 0.25em; flex: none; }
      /* Quiet verbs: present at rest, no chrome to add up around two names. */
      #roster .actions button { font-size: 0.8em; padding: 0.3em 0.6em; background: none;
        border-color: transparent; color: var(--muted-foreground); }
      #roster .actions button:hover:not(:disabled) { background: var(--muted-hover);
        border-color: var(--border-strong); color: var(--foreground); }
      .empty { color: var(--muted-foreground); font-size: 0.9em; padding: 0.5em 0.55em; margin: 0; }
      #tree { margin: 0; padding: 0; }
      #tree ul { list-style: none; margin: 0; padding-left: 1em; }
      #tree > ul { padding-left: 0; }
      #tree li { margin: 2px 0; }
      #tree summary { display: flex; align-items: center; gap: 0.4em; padding: 0.4em 0.55em;
        border-radius: var(--radius); cursor: pointer; list-style: none; font-weight: 600; }
      #tree summary::-webkit-details-marker { display: none; }
      #tree summary:hover { background: var(--muted); }
      #tree summary .chev { color: var(--muted-foreground); transition: transform 0.12s ease; }
      #tree details[open] > summary .chev { transform: rotate(90deg); }
      #tree button.row { display: flex; align-items: center; gap: 0.45em; width: 100%;
        box-sizing: border-box; background: none; border: 1px solid transparent;
        text-align: left; color: var(--foreground); padding: 0.4em 0.55em; border-radius: var(--radius); }
      #tree button.row:hover { background: var(--muted); }
      #tree button.row.open { background: var(--muted); border-color: var(--border-strong); font-weight: 600; }
      #tree button.row .icon { color: var(--muted-foreground); }
      #tree button.row .presence { display: inline-flex; gap: 0.2em; margin-left: auto; flex: none; }
      #tree button.row .badge { font: 700 0.68em/1.6 monospace; color: #000;
        border: 1px solid #000; border-radius: 3px; padding: 0 0.25em; }
      #tree button.row .unpub { font-size: 0.68em; font-weight: 500; white-space: nowrap;
        color: var(--muted-foreground); border: 1px solid var(--border-strong);
        border-radius: 3px; padding: 0 0.3em; }
      #tree .stale { color: var(--muted-foreground); font-size: 0.85em; padding: 0.5em 0.55em;
        margin: 0 0 0.5em; border-bottom: 1px solid var(--border); }
      #tree button.row:disabled { cursor: not-allowed; }
      #editor { flex: 1; min-height: 0; min-width: 0; }
      #preview { position: fixed; inset: 0; display: flex; min-height: 0; }
      #preview .fake-side { width: 19rem; flex: none; background: var(--card);
        border-right: 1px solid var(--border); padding: 0.7em 0.8em 1em; }
      #preview .fake-bar { border-radius: var(--radius); background: var(--muted); margin: 0.45em 0;
        height: 0.9em; }
      #preview .fake-side .fake-bar:nth-child(odd) { width: 82%; }
      #preview .fake-side .fake-bar:nth-child(even) { width: 64%; }
      #preview .fake-main { flex: 1; min-width: 0; padding: 1.2em 1.6em; }
      #preview .fake-main .fake-bar:nth-child(3n) { width: 68%; }
      #preview .fake-main .fake-bar:nth-child(3n+1) { width: 92%; }
      #preview .fake-main .fake-bar:nth-child(3n+2) { width: 79%; }
      #veil { position: fixed; inset: 0; background: rgba(17, 17, 27, 0.6);
        backdrop-filter: blur(11px); -webkit-backdrop-filter: blur(11px); }
      #join { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
        width: min(24rem, calc(100vw - 2rem)); box-sizing: border-box; margin: 0;
        padding: 1.9rem 1.9rem 1.6rem; max-height: calc(100vh - 2rem); overflow-y: auto;
        background: var(--card); border: 1px solid var(--border); border-radius: 14px;
        box-shadow: var(--shadow); z-index: 1; }
      #join .mark { display: block; width: 3.25rem; height: 3.25rem; margin: 0 0 1rem; }
      #join h1 { margin: 0 0 1.15rem; font-size: 1.35rem; font-weight: 650;
        line-height: 1.3; letter-spacing: -0.01em; }
      /* The line the card carries when a session ends: what happened, then the
         one next step. It is the reason the card came back, so it reads first. */
      #join-message { margin: 0 0 1.2rem; padding: 0.75em 0.9em; border-radius: var(--radius);
        background: rgba(243, 139, 168, 0.12); border: 1px solid rgba(243, 139, 168, 0.4);
        color: var(--foreground); font-size: 0.92em; line-height: 1.5; }
      #join label { display: block; margin: 0 0 1rem; font-size: 0.8rem; font-weight: 600;
        letter-spacing: 0.01em; color: var(--muted-foreground); }
      #join input { display: block; width: 100%; box-sizing: border-box; margin-top: 0.4em;
        font-size: 1rem; font-weight: normal; padding: 0.7em 0.8em;
        transition: border-color 0.15s ease; }
      #join input:focus { border-color: var(--primary); }
      #join-button { display: flex; width: 100%; justify-content: center;
        margin-top: 0.4rem; padding: 0.8em 1.1em; font-size: 1em;
        transition: background-color 0.15s ease,
        border-color 0.15s ease, transform 0.08s ease; }
      #join-button:active:not(:disabled) { transform: translateY(1px); }
      #join-error { color: var(--danger); min-height: 1.4em; margin: 0.85rem 0 0;
        font-size: 0.9em; }
      @media (max-width: 640px) {
        #session { flex-wrap: wrap; row-gap: 0.4em; }
        #share-group { order: 3; flex-basis: 100%; max-width: none; }
        #share-group #share { display: none; }
        #workspace { flex-direction: column; }
        #side { width: auto; border-right: none; border-bottom: 1px solid var(--border);
          max-height: 38%; }
        #join { width: calc(100vw - 1.6rem); padding: 1.5rem 1.4rem 1.3rem; }
      }
      /* The reveal is a fade everywhere else; without motion it lands at once. */
      @media (prefers-reduced-motion: reduce) {
        #share, #share-group, #join-button, #tree summary .chev, #join input {
          transition: none !important;
        }
        #join-button:active:not(:disabled) { transform: none; }
      }
    </style>
  </head>
  <body>
    <svg class="mark-sprite" aria-hidden="true" focusable="false"><symbol id="svp-mark" viewBox="0 0 211.6667 211.66669"><g transform="matrix(1.0246445 0 0 0.96727946 27.087777 -26.588935)"><path d="M289 -4Q219 -4 159.5 17.5Q100 39 67 72Q52 88 54.5 108.5Q57 129 74 142Q94 158 113.5 155.5Q133 153 147 138Q164 119 201.5 102.5Q239 86 285 86Q343 86 373.5 105.0Q404 124 405 154Q406 184 376.5 206.0Q347 228 269 242Q168 262 122.5 302.0Q77 342 77 400Q77 451 107.0 484.5Q137 518 184.0 534.5Q231 551 282 551Q348 551 399.0 530.0Q450 509 480 472Q494 456 493.0 438.5Q492 421 476 409Q460 398 438.0 402.0Q416 406 401 420Q376 444 347.0 453.0Q318 462 280 462Q236 462 205.5 447.0Q175 432 175 403Q175 385 184.5 370.5Q194 356 222.0 344.5Q250 333 304 322Q417 300 460.5 259.5Q504 219 504 160Q504 114 479.5 77.0Q455 40 407.5 18.0Q360 -4 289 -4Z" transform="translate(4.7136 147.98276) scale(0.079375 -0.079375)" fill="#cba6f7" fill-rule="evenodd" stroke="#181825" stroke-width="2.51118" stroke-linejoin="round" paint-order="markers fill stroke" /><path d="M275 1Q244 1 227 34L15 481Q7 498 13.5 514.5Q20 531 39 540Q56 549 73.5 543.0Q91 537 100 520L274 145L446 520Q455 537 473.5 543.0Q492 549 511 540Q529 532 535.0 515.0Q541 498 533 481L321 34Q306 1 275 1Z" transform="translate(47.8142 147.98276) scale(0.079375 -0.079375)" fill="#94e2d5" fill-rule="evenodd" stroke="#181825" stroke-width="2.51118" stroke-linejoin="round" paint-order="markers fill stroke" /><path d="M141 -234Q119 -234 104.5 -219.5Q90 -205 90 -183V273Q91 352 127.0 415.0Q163 478 225.0 514.5Q287 551 365 551Q444 551 506.0 514.5Q568 478 604.5 415.0Q641 352 641 273Q641 194 607.5 131.5Q574 69 516.0 32.5Q458 -4 385 -4Q326 -4 276.5 20.5Q227 45 192 87V-183Q192 -205 178.0 -219.5Q164 -234 141 -234ZM365 86Q416 86 456.0 110.5Q496 135 519.5 177.5Q543 220 543 273Q543 327 519.5 369.5Q496 412 456.0 436.5Q416 461 365 461Q315 461 274.5 436.5Q234 412 211.0 369.5Q188 327 188 273Q188 220 211.0 177.5Q234 135 274.5 110.5Q315 86 365 86Z" transform="translate(91.3117 147.     <div id="app">
      <div id="session" hidden>
        <span id="brand"><svg class="mark" viewBox="0 0 211.6667 211.66669" aria-hidden="true" focusable="false"><use href="#svp-mark" /></svg>Selvage</span>
        <div id="share-group" role="button" tabindex="0" aria-label="Copy invite link" title="Copy invite link">
          <span class="icon" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6.5 9.5a3 3 0 0 0 4.2 0l2-2a3 3 0 0 0-4.2-4.2l-1 1"/><path d="M9.5 6.5a3 3 0 0 0-4.2 0l-2 2a3 3 0 0 0 4.2 4.2l1-1"/></svg></span>
          <input id="share" readonly tabindex="-1" spellcheck="false" autocomplete="off" aria-label="Guest invite link" />
        </div>
      </div>
      <div id="session-note" aria-live="polite"></div>
      <div id="follow-banner" hidden></div>
      <div id="preview" aria-hidden="true">
        <div class="fake-side">
          <div class="fake-bar"></div><div class="fake-bar"></div><div class="fake-bar"></div>
          <div class="fake-bar"></div><div class="fake-bar"></div><div class="fake-bar"></div>
        </div>
        <div class="fake-main">
          <div class="fake-bar"></div><div class="fake-bar"></div><div class="fake-bar"></div>
          <div class="fake-bar"></div><div class="fake-bar"></div><div class="fake-bar"></div>
          <div class="fake-bar"></div><div class="fake-bar"></div><div class="fake-bar"></div>
          <div class="fake-bar"></div><div class="fake-bar"></div><div class="fake-bar"></div>
        </div>
      </div>
      <div id="veil" aria-hidden="true"></div>
      <div id="join">
        <svg class="mark" viewBox="0 0 211.6667 211.66669" aria-hidden="true" focusable="false"><use href="#svp-mark" /></svg>
        <h1>Join a shared session</h1>
        <p id="join-message" hidden></p>
        <form id="join-form" action="#">
          <label id="invite-wrap" hidden>Paste your invite link
            <input id="invite" type="text" autocomplete="off" spellcheck="false"
              placeholder="/?room=…&token=…" />
          </label>
          <label>The name other participants see
            <input id="name" type="text" maxlength="32" autocomplete="off" placeholder="Ada" />
          </label>
          <button id="join-button" class="primary" type="submit">Join</button>
        </form>
        <p id="join-error" role="alert"></p>
      </div>
      <div id="workspace" hidden>
        <div id="side">
          <h2>People</h2>
          <ul id="roster"></ul>
          <h2>Shared</h2>
          <div id="tree"></div>
        </div>
        <div id="editor"></div>
      </div>
      <div id="alert" role="alert"></div>
    </div>
    <script>
      // Pre-bundle guard, first so nothing below can disarm it: the card shell
      // is usable before app.js arrives, so a submit that lands first is held —
      // never a bare navigation, which would wipe what was typed — and replayed
      // once the bundle arms the card.
      window.__selvageJoinArmed = false;
      window.__selvagePendingJoin = false;
      document.getElementById('join-form').addEventListener('submit', function (event) {
        if (!window.__selvageJoinArmed) {
          event.preventDefault();
          window.__selvagePendingJoin = true;
          // The bundle replays this submit on arrival, which can take a
          // while: answer the Enter now, so it never looks dead. A refused
          // replay hands the card back (see `attemptJoin`).
          var button = document.getElementById('join-button');
          if (button) {
            button.disabled = true;
            button.textContent = 'Joining…';
          }
        }
      });
      // Pre-bundle card: this runs while the parser is still reading the shell,
      // so what it decides is what the first frame paints — never a card that
      // grows a paste box or a remembered name once the bundle lands. It
      // decides the same two things the bundle's `initJoinCard` decides when it
      // takes over (src/browser/join.ts), and test/join-paint.test.ts runs both
      // against the same address bars and holds them to the same answer.
      (function () {
        // A `?` past the first is a separator, the way `pageQueryParams` reads
        // the address bar: an appended `?debug=1` must not glue into the token.
        var query = window.location.search.replace(/^\?/, '').replace(/\?/g, '&');
        var params = new URLSearchParams(query);
        var room = (params.get('room') || '').trim();
        var token = (params.get('token') || '').trim();
        document.getElementById('invite-wrap').hidden = room !== '' && token !== '';
        var name = document.getElementById('name');
        if (name.value === '') {
          try {
            name.value = window.localStorage.getItem('selvage.displayName') || '';
          } catch (error) {
            name.value = '';
          }
        }
      })();
    </script>
    <script type="module" src="app.js"></script>
