name: ci

# No `push: branches: [main]`: a pull request already runs the whole job, and the
# merge commit carries the content it proved. `workflow_dispatch` is the re-run for a
# commit that reached `main` without one.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    # `npm run build` shells out to ImageMagick 7's `magick` for the sized icons, and
    # `ubuntu-24.04` ships ImageMagick 6 (`convert` alone). So this job runs in the
    # image the reference server's page stage builds the same bundle in —
    # `node:22-trixie-slim`, whose trixie imagemagick is 7 — which also makes the step
    # that asserts a build reproduces the committed `dist/` run in the environment the
    # page is built in everywhere else.
    #
    # A job container's own filesystem is the image's, so `git` and an `/etc/ssl` have
    # to be installed first; see the step below.
    runs-on: ubuntu-24.04
    container: node:22-trixie-slim
    timeout-minutes: 20
    steps:
      # Before the checkout: the slim image carries no git and, more to the point, no
      # `/etc/ssl` at all, because the official node images install `ca-certificates`
      # and purge it as auto-removable in the same layer. Node carries its own trusted
      # roots; git, which the checkout uses over HTTPS, does not. ImageMagick 7's
      # `magick` is here because `npm run build` shells out to it for the sized icons.
      # `python3` and its PyYAML are here for the `dry_run` guard below, which is the one
      # check in this repository that is not Node's: it reads `.github/workflows` back, so
      # no suite can cover it, and Debian's `python3-yaml` is where it gets the parser.
      - name: install git, ca-certificates, ImageMagick 7 and python3
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git imagemagick python3 python3-yaml

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The guard around a workflow's `dry_run` input (`scripts/check_dry_run_gating.py`):
      # `release.yml` and `deploy-prod.yml` both declare one, its plan step prints what the run
      # would have done, and every step after each plan step carries `!inputs.dry_run` — which is
      # the whole of what keeps a rehearsal from cutting a release or moving the public demo's
      # image. `actionlint` cannot see a condition that is *missing* from a step, so nothing else
      # reads that. This job's container is `node:22-trixie-slim` and its steps run under `sh`, so
      # the step above installs python3 and python3-yaml; `scripts/ci-local.sh checks` runs the
      # same two files through a venv under `.tmp/`.
      - name: the dry_run gating of the workflows that declare it
        run: |
          python3 -B scripts/test_check_dry_run_gating.py
          python3 -B scripts/check_dry_run_gating.py .github/workflows

      - run: npm ci --no-audit --no-fund

      - run: npm run typecheck

      # The commit's own `dist/`, which the next step rebuilds over: a copy rather than a
      # git reference, so the comparison below needs no git in this container.
      - name: keep the committed dist/ to compare against
        run: cp -r dist "$RUNNER_TEMP/dist-committed"

      - run: npm run build

      # The image ships the committed `dist/` rather than rebuilding it (see the
      # Dockerfile), so this is where a source change that was never built is caught,
      # rather than in an image that would carry a stale page. `scripts/check-dist.sh`
      # owns the rule and `scripts/ci-local.sh` runs the same script, so there is one
      # place to keep it: every file the bundler writes byte for byte, and the six
      # icons, which are rendered at build time, at their six sizes — an ImageMagick
      # version decides both a PNG encoder's choices and its resampler, and this job
      # carries trixie's 7.1.1.x where the committed icons came from a 7.1.2.
      #
      # The copy it compares against is the one the step above took, so this needs no
      # git either: the container's `git` could not read the workspace here.
      - name: the build reproduces the committed dist/
        run: scripts/check-dist.sh "$RUNNER_TEMP/dist-committed"

      # `test/identity.test.ts` compares the page's mark with the `site` checkout
      # beside this one, which a single-checkout job does not have: that one test
      # skips, with that reason, and the rest of the file — the icons' determinism
      # and the clock chunks a fresh clone would render differently — runs here.
      # `test/serve-types.test.ts` needs no sibling and runs. The checks that do need
      # something live — `npm run check:types` (a deployed page) and `npm run prove*`
      # (a `selvaged`) — run locally; the image workflow's smoke is the served-page
      # assertion CI has.
      - name: the suite CI can run
        run: npm run test:ci

      # `scripts/test-bump-version.sh` covers the version bump the release coordinator
      # calls, in a clone under `.tmp/` of its own so a red run here leaves the tree
      # above as it was. It needs what the other steps need — node, `magick` and git —
      # and nothing else, which is why it runs here rather than locally only.
      - name: the version bump, and the bundle it has to rebuild
        run: scripts/test-bump-version.sh

      # `scripts/test-release-plan.sh` covers what the release button refuses before it
      # touches anything — the version whose tag never landed, and a target tag that is
      # already there. It builds its own remote under `.tmp/`, so it needs git and bash and
      # reaches no network.
      - name: the release plan, against real tag states
        run: scripts/test-release-plan.sh

      # Every shell script this repository has is under `scripts/`, and the release workflow is
      # the only thing that reaches some of them: its plan runs before the push, while
      # `page-image.sh` and `verify-page-deploy.sh` run after it, once `main` carries the bump
      # and the tag exists. So this parse is the last cheap place before a release that they are
      # read at all. What it catches is a script that does not parse; how each behaves is the
      # two script suites' business.
      #
      # A glob rather than `git ls-files`, and not only because this job's container cannot read
      # the workspace with git: a glob reaches a script that is not committed yet, too.
      - name: every shell script this repository has parses
        run: |
          set -eu
          for script in scripts/*.sh; do
            if [ ! -e "$script" ]; then
              echo "::error::scripts/*.sh matched nothing, so this check read no script at all" >&2
              exit 1
            fi
            printf '%s\n' "$script"
            bash -n "$script"
          done
